<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
  <template>
    <style>

    * { margin:0; padding:0; box-sizing:border-box; }

    .brand-bar {
      position:absolute; top:28px; left:72px; z-index:5;
      display:flex; align-items:center; gap:14px; pointer-events:none;
    }
    .brand-bar img { height:28px; width:auto; display:block; }
    .brand-bar .pipe { color:rgba(255,255,255,0.35); font-size:22px; font-weight:300; line-height:1; }
    .brand-bar .product {
      font-size:15px; font-weight:600; letter-spacing:0.04em; color:rgba(255,255,255,0.88);
    }

    .center {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; gap:22px; padding:0 120px;
    }
    .kicker {
      font-size:14px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#7ee8ff;
    }
    .title {
      font-size:72px; font-weight:700; letter-spacing:-0.04em; line-height:1.05; max-width:1200px;
    }
    .sub {
      font-size:22px; color:rgba(255,255,255,0.78); line-height:1.45; max-width:820px;
    }

    /* ---- sub-composition scaffold + animation affordances ---- */
    #root { position:absolute; inset:0; overflow:hidden; box-sizing:border-box;
            font-family:Inter,system-ui,sans-serif; color:#fff; }
    .scene { position:absolute; inset:0; }
    .bg { position:absolute; inset:0; z-index:0; background:radial-gradient(1200px 760px at 50% -12%, rgba(255,255,255,0.14), transparent 56%),linear-gradient(162deg, #0e1878 0%, #1a32c4 58%, #1e38b0 100%); }
    .brand-bar, .label, .main { z-index:2; }

    .hair { transform-origin:left center; }
    .vrule { transform-origin:center center; }
    .bar, .fill2, .stops .link { transform-origin:left center; }
    .xl, .lg, .md, .sm, .kw { font-variant-numeric:tabular-nums; }
    .w, .sig, .sigdot { display:inline-block; }
    .sigdot { opacity:0.4; padding:0 8px; }
    .ln { display:block; }

    /* WCAG AA on the blue field — the muted greys a mock gets away with do not pass */
    .eyebrow { color:rgba(255,255,255,0.68); }
    .note { color:rgba(255,255,255,0.68); }
    .krow .kf { color:rgba(255,255,255,0.66); }
    .mk i { color:rgba(255,255,255,0.8); }
    .sigdot { opacity:0.55; }

    /* Budget frame: keep the stat band under the title, not floating in empty flex space */
    .cols.cards { flex: none; align-items: stretch; }

    /* Bookend slides carry the logo as a lockup; the host bar is suppressed over them */
    .brandmark { display:flex; justify-content:center; margin-bottom:10px; }
    .brandmark img { height:54px; width:auto; display:block; }
    </style>

    <div data-hf-id="hf-iymd" id="root" data-composition-id="00-title" data-duration="11.1" data-width="1920" data-height="1080">
      <div data-hf-id="hf-wua0" class="scene">
        <div data-hf-id="hf-m7dd" class="bg"></div>

    <div data-hf-id="hf-0oij" class="center">
      <div data-hf-id="hf-brm0" class="brandmark"><img data-hf-id="hf-brm1" src="/assets/frontiers.png" alt="Frontiers"></div>
      <div data-hf-id="hf-v43a" class="kicker">AIRA in-review check</div>
      <h1 data-hf-id="hf-b4cg" class="title">Cluster Analysis</h1>
      <p data-hf-id="hf-imi4" class="sub">Index identity. Cap the noise. Shortlist the peers that earn a BLOCK or WARN.</p>
    </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var R  = document.querySelector('[data-composition-id="00-title"]');
      var q  = function (s) { return R.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(R.querySelectorAll(s)); };
      var SC = q('.scene');
      var K = 1.1327;                       // frame stretch factor — see SKETCH_LEN in the build script
      var _tl = gsap.timeline({ paused: true });

      function stretch(v) {
        var o = {}, key;
        for (key in v) { if (v.hasOwnProperty(key)) { o[key] = v[key]; } }
        if (typeof o.duration === 'number') { o.duration *= K; }
        if (typeof o.stagger === 'number') { o.stagger *= K; }
        else if (o.stagger && typeof o.stagger.each === 'number') {
          o.stagger = { each: o.stagger.each * K, from: o.stagger.from };
        }
        return o;
      }
      var tl = {
        fromTo: function (t, a, b, p) { _tl.fromTo(t, a, stretch(b), p * K); return tl; },
        to: function (t, b, p) { _tl.to(t, stretch(b), p * K); return tl; }
      };

      function count(el, to, dur, at, opt) {
        opt = opt || {};
        var dec = opt.dec || 0, suf = opt.suf || '', st = { v: opt.from || 0 };
        var write = function (v) {
          el.textContent = (dec ? v.toFixed(dec)
                                : Math.round(v).toLocaleString('en-US')) + suf;
        };
        write(st.v);
        tl.to(st, { v: to, duration: dur, ease: opt.ease || 'power2.out',
                    onUpdate: function () { write(st.v); } }, at);
      }


      var t = q('.title');
      t.innerHTML = t.textContent.trim().split(/\s+/)
        .map(function (w) { return '<span class="w">' + w + '</span>'; }).join(' ');

      tl.fromTo(SC, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power1.inOut' }, 0);
      tl.fromTo(q('.brandmark'), { autoAlpha: 0, y: 14 },
        { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 0.25);
      tl.fromTo(q('.kicker'), { autoAlpha: 0, y: 18 },
        { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 0.7);
      tl.fromTo(qa('.title .w'), { autoAlpha: 0, y: 70, scale: 0.9 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.8, ease: 'back.out(1.6)', stagger: 0.11 }, 0.95);
      tl.fromTo(q('.sub'), { autoAlpha: 0, y: 22 },
        { autoAlpha: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 1.9);
      window.__timelines["00-title"] = _tl;
    </script>
  </template>
</body>
</html>
